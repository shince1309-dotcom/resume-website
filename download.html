<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 4: Download - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <a href="index.html" class="hover:text-indigo-600 transition">1. Intro</a>
        <a href="build.html" class="hover:text-indigo-600 transition">2. Build</a>
        <a href="preview.html" class="hover:text-indigo-600 transition">3. Preview</a>
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">4. Download</span>
    </nav>

    <div class="flex-grow flex flex-col items-center justify-center px-4">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-6">Export Your Document</h1>
        <button onclick="downloadFinalPDF()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold text-lg shadow-xl hover:bg-indigo-700 transition">
            📥 Download PDF
        </button>

        <div id="pdfContainer" class="hidden absolute top-[-9999px]"></div>
    </div>

    <script>
        window.onload = function() {
            const data = JSON.parse(localStorage.getItem('resumeData'));
            const container = document.getElementById('pdfContainer');
            
            const skillsList = data.skills.split(',').map(s => `<li>${s.trim()}</li>`).join('');
            const langList = data.languages.split(',').map(l => `<li>${l.trim()}</li>`).join('');
            const hobbiesList = data.hobbies.split(',').map(h => `<li>${h.trim()}</li>`).join('');
            const photoSrc = data.photo || "https://via.placeholder.com/150";
            
            if(data && data.template === 'classic') {
                container.innerHTML = `
                <div id="printArea" style="padding:40px; font-family:sans-serif; width:800px; color:#1e293b;">
                    <div style="display:flex; justify-content:space-between; border-bottom:4px solid #1e293b; padding-bottom:20px; margin-bottom:20px;">
                        <div>
                            <h1 style="font-size:32px; font-weight:bold; margin:0; text-transform:uppercase;">${data.name}</h1>
                            <h2 style="font-size:18px; color:#475569; margin:5px 0 15px 0;">${data.title}</h2>
                            <p style="font-size:14px; margin:2px 0;">📍 ${data.address}</p>
                            <p style="font-size:14px; margin:2px 0;">📞 ${data.phone}</p>
                            <p style="font-size:14px; margin:2px 0;">✉️ ${data.email}</p>
                        </div>
                        <div>
                            <img src="${photoSrc}" style="width:120px; height:120px; object-fit:cover; border:2px solid #cbd5e1; display:${data.photo ? 'block' : 'none'};">
                        </div>
                    </div>
                    <h3 style="background:#e2e8f0; padding:5px; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Professional Summary</h3>
                    <p style="font-size:14px; margin-bottom:20px;">${data.summary}</p>
                    
                    <div style="display:flex; gap:40px; margin-bottom:20px;">
                        <div style="width:50%;">
                            <h3 style="background:#e2e8f0; padding:5px; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Skills</h3>
                            <ul style="font-size:14px; padding-left:20px; margin:0;">${skillsList}</ul>
                        </div>
                        <div style="width:50%;">
                            <h3 style="background:#e2e8f0; padding:5px; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Languages</h3>
                            <ul style="font-size:14px; padding-left:20px; margin:0;">${langList}</ul>
                        </div>
                    </div>

                    <h3 style="background:#e2e8f0; padding:5px; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Work Experience</h3>
                    <p style="font-size:14px; margin-bottom:20px; white-space:pre-line;">${data.experience}</p>
                    
                    <h3 style="background:#e2e8f0; padding:5px; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Education</h3>
                    <p style="font-size:14px; margin-bottom:20px; white-space:pre-line;">${data.edu}</p>
                    
                    <h3 style="background:#e2e8f0; padding:5px; font-size:14px; text-transform:uppercase; margin-bottom:10px;">Hobbies</h3>
                    <p style="font-size:14px;">${data.hobbies}</p>
                </div>`;
            } else if(data) {
                container.innerHTML = `
                <div id="printArea" style="display:flex; font-family:sans-serif; width:800px; min-height:1100px;">
                    <div style="width:35%; background:#1a2332; color:white; padding:40px;">
                        <div style="text-align:center; margin-bottom:30px;">
                            <img src="${photoSrc}" style="width:140px; height:140px; border-radius:50%; object-fit:cover; border:3px solid #64748b; background:white; display:${data.photo ? 'inline-block' : 'none'};">
                        </div>
                        <h3 style="border-bottom:1px solid #475569; padding-bottom:5px; margin-bottom:15px;">Contact</h3>
                        <p style="font-size:12px; color:#94a3b8; font-weight:bold; margin-bottom:2px;">ADDRESS</p><p style="font-size:14px; margin-bottom:10px;">${data.address}</p>
                        <p style="font-size:12px; color:#94a3b8; font-weight:bold; margin-bottom:2px;">PHONE</p><p style="font-size:14px; margin-bottom:10px;">${data.phone}</p>
                        <p style="font-size:12px; color:#94a3b8; font-weight:bold; margin-bottom:2px;">EMAIL</p><p style="font-size:14px; margin-bottom:25px; word-break:break-all;">${data.email}</p>
                        <h3 style="border-bottom:1px solid #475569; padding-bottom:5px; margin-bottom:15px;">Skills</h3>
                        <ul style="font-size:14px; padding-left:20px; margin-bottom:25px;">${skillsList}</ul>
                        <h3 style="border-bottom:1px solid #475569; padding-bottom:5px; margin-bottom:15px;">Languages</h3>
                        <ul style="font-size:14px; padding-left:20px; margin-bottom:25px;">${langList}</ul>
                        <h3 style="border-bottom:1px solid #475569; padding-bottom:5px; margin-bottom:15px;">Hobbies</h3>
                        <ul style="font-size:14px; padding-left:20px;">${hobbiesList}</ul>
                    </div>
                    <div style="width:65%; padding:40px; background:white;">
                        <h1 style="font-size:42px; font-weight:bold; text-transform:uppercase; margin:0; color:#0f172a;">${data.name}</h1>
                        <h2 style="font-size:22px; color:#475569; margin-top:5px; margin-bottom:40px;">${data.title}</h2>
                        <h3 style="font-size:20px; border-bottom:2px solid #e2e8f0; padding-bottom:5px; color:#1e293b; margin-bottom:10px;">Profile</h3>
                        <p style="font-size:14px; color:#334155; line-height:1.6; margin-bottom:30px;">${data.summary}</p>
                        <h3 style="font-size:20px; border-bottom:2px solid #e2e8f0; padding-bottom:5px; color:#1e293b; margin-bottom:10px;">Work Experience</h3>
                        <p style="font-size:14px; color:#334155; line-height:1.6; white-space:pre-line; margin-bottom:30px;">${data.experience}</p>
                        <h3 style="font-size:20px; border-bottom:2px solid #e2e8f0; padding-bottom:5px; color:#1e293b; margin-bottom:10px;">Education</h3>
                        <p style="font-size:14px; color:#334155; line-height:1.6; white-space:pre-line;">${data.edu}</p>
                    </div>
                </div>`;
            }
        };

        function downloadFinalPDF() {
            const element = document.getElementById('printArea');
            document.getElementById('pdfContainer').classList.remove('hidden');
            html2pdf().from(element).set({
                margin: 0, filename: 'My_Resume.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save().then(() => document.getElementById('pdfContainer').classList.add('hidden'));
        }
    </script>
</body>
</html>
