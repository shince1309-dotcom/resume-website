<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 4: Download - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <a href="index.html" class="hover:text-indigo-600 transition">1. Intro</a>
        <a href="build.html" class="hover:text-indigo-600 transition">2. Build</a>
        <a href="preview.html" class="hover:text-indigo-600 transition">3. Preview</a>
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">4. Download</span>
    </nav>

    <div class="flex-grow flex flex-col items-center justify-center px-4">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-6">Export Your Document</h1>
        <button onclick="downloadFinalPDF()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold text-lg shadow-xl hover:bg-indigo-700 transition">
            📥 Download PDF
        </button>

        <div id="pdfContainer" class="hidden absolute top-[-9999px]"></div>
    </div>

    <script>
        window.onload = function() {
            const data = JSON.parse(localStorage.getItem('resumeData'));
            const container = document.getElementById('pdfContainer');
            
            if(data && data.template === 'classic') {
                container.innerHTML = `
                <div id="printArea" style="padding:40px; font-family:sans-serif; width:800px;">
                    <h1 style="text-align:center; font-size:24px; text-decoration:underline;">RESUME</h1>
                    <h2>${data.name}</h2><p>${data.address}</p><p>Mob No: ${data.phone}</p>
                    <div style="background:#eee; padding:5px; font-weight:bold; margin-top:15px;">CAREER OBJECTIVE</div>
                    <p style="margin-top:10px;">${data.summary}</p>
                    <div style="background:#eee; padding:5px; font-weight:bold; margin-top:15px;">ACADEMIC QUALIFICATION</div>
                    <p style="margin-top:10px;">${data.edu}</p>
                    <div style="background:#eee; padding:5px; font-weight:bold; margin-top:15px;">WORK EXPERIENCE</div>
                    <p style="margin-top:10px;">${data.experience}</p>
                    <div style="background:#eee; padding:5px; font-weight:bold; margin-top:15px;">PERSONAL INFORMATION</div>
                    <p style="margin-top:10px;">DOB: ${data.dob} | Languages: ${data.languages}</p>
                </div>`;
            } else if(data) {
                container.innerHTML = `
                <div id="printArea" style="display:flex; font-family:sans-serif; width:800px; min-height:1000px;">
                    <div style="width:35%; background:#6b8e89; color:white; padding:40px;">
                        <h3 style="margin-bottom:10px;">PROFILE</h3><p style="font-size:14px;">${data.summary}</p>
                        <h3 style="margin-top:30px; margin-bottom:10px;">CONTACT</h3><p style="font-size:14px;">${data.phone}<br>${data.address}</p>
                    </div>
                    <div style="width:65%; padding:40px; background:white;">
                        <h1 style="color:#6b8e89; font-size:35px; text-transform:uppercase;">${data.name}</h1>
                        <h3 style="color:#6b8e89; margin-top:40px;">EDUCATION</h3><p>${data.edu}</p>
                        <h3 style="color:#6b8e89; margin-top:30px;">LANGUAGES</h3><p>${data.languages}</p>
                        <h3 style="color:#6b8e89; margin-top:30px;">EXPERIENCE</h3><p>${data.experience}</p>
                    </div>
                </div>`;
            }
        };

        function downloadFinalPDF() {
            const element = document.getElementById('printArea');
            document.getElementById('pdfContainer').classList.remove('hidden');
            html2pdf().from(element).set({
                margin: 0, filename: 'My_Resume_Export.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save().then(() => document.getElementById('pdfContainer').classList.add('hidden'));
        }
    </script>
</body>
</html>
