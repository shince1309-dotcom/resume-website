<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: Welcome - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">1. Intro</span>
        <span>2. Build</span>
        <span>3. Preview</span>
        <span>4. Download</span>
    </nav>

    <div class="flex-grow flex flex-col items-center justify-center px-4 py-10">
        <div class="text-center mb-6">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight">Interactive <span class="text-indigo-600">Resume Builder</span></h1>
            <p class="text-slate-500 mt-2 font-medium text-lg">GitHub Practical Assignment</p>
        </div>

        <div class="mb-10 bg-white border border-indigo-100 rounded-2xl p-5 text-center shadow-md w-full max-w-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500"></div>
            <h2 class="text-xs font-bold uppercase tracking-widest text-indigo-500 mb-3">Project Submitted By</h2>
            <p class="text-slate-800 font-bold text-xl">Shince Shibu Scaria</p>
            <p class="text-slate-600 font-medium mt-1">Roll No: 5250 | TY BSc IT | St. Andrew's College</p>
        </div>

        <h2 class="text-2xl font-bold text-slate-800 mb-6">How would you like to start?</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl">
            <a href="build.html" class="bg-white border-2 border-transparent hover:border-indigo-600 p-8 rounded-2xl shadow-lg hover:shadow-xl transition flex flex-col items-center text-center cursor-pointer group">
                <div class="bg-indigo-50 p-4 rounded-full mb-4 group-hover:bg-indigo-100 transition">
                    <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-slate-900">Start from scratch</h3>
                <p class="text-slate-500 mt-2">Enter your details manually.</p>
            </a>

            <label class="bg-white border-2 border-transparent hover:border-emerald-600 p-8 rounded-2xl shadow-lg hover:shadow-xl transition flex flex-col items-center text-center cursor-pointer group relative">
                <div class="bg-emerald-50 p-4 rounded-full mb-4 group-hover:bg-emerald-100 transition">
                    <svg class="w-10 h-10 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-slate-900">Upload an existing resume</h3>
                <p class="text-slate-500 mt-2">Auto-fill form using Mock AI Demo.</p>
                <input type="file" accept=".pdf" class="hidden" onchange="handleUpload(this)">
            </label>
        </div>
    </div>

    <script>
        function handleUpload(input) {
            if (input.files && input.files[0]) {
                alert(`Scanning ${input.files[0].name}...\n\nExtracting text... Redirecting to builder.`);
                localStorage.setItem('demoUpload', 'true');
                window.location.href = 'build.html';
            }
        }
    </script>
</body>
</html>
