<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Build - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <a href="index.html" class="hover:text-indigo-600 transition">1. Intro</a>
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">2. Build</span>
        <span>3. Preview</span>
        <span>4. Download</span>
    </nav>

    <div class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="max-w-3xl w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            
            <!-- TEMPLATES ARE BACK! -->
            <h2 class="text-2xl font-bold text-slate-900 mb-4 border-b pb-2">1. Choose Template</h2>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <label class="border-2 border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-500 flex items-center gap-3">
                    <input type="radio" name="template" value="classic" checked class="w-5 h-5 text-indigo-600">
                    <span class="font-bold">Classic (Tabular)</span>
                </label>
                <label class="border-2 border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-500 flex items-center gap-3">
                    <input type="radio" name="template" value="modern" class="w-5 h-5 text-indigo-600">
                    <span class="font-bold">Modern (Sidebar)</span>
                </label>
            </div>

            <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-2">2. Enter Your Details</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Profile Photo</label>
                    <input type="file" id="photo" accept="image/*" class="w-full mt-1 p-2 bg-slate-50 border rounded-lg">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Full Name</label>
                        <input type="text" id="name" placeholder="Max Johnson" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Job Title</label>
                        <input type="text" id="title" placeholder="UX Designer" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Phone</label>
                        <input type="text" id="phone" placeholder="+1 2345 6789" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Email</label>
                        <input type="email" id="email" placeholder="max@email.com" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Location</label>
                        <input type="text" id="address" placeholder="New York, USA" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Skills (Comma separated)</label>
                        <input type="text" id="skills" placeholder="Figma, Sketch, UI/UX" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Languages</label>
                        <input type="text" id="languages" placeholder="English, French" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Hobbies</label>
                        <input type="text" id="hobbies" placeholder="Photography, Cooking" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700">Profile Summary</label>
                    <textarea id="summary" rows="3" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Work Experience</label>
                        <textarea id="experience" rows="3" placeholder="Senior UX Designer - ABC Tech..." class="w-full mt-1 p-3 bg-slate-50 border rounded-lg"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Education</label>
                        <textarea id="edu" rows="3" placeholder="Master of Science in HCI - NYU..." class="w-full mt-1 p-3 bg-slate-50 border rounded-lg"></textarea>
                    </div>
                </div>

                <div class="mt-8 text-right">
                    <button onclick="saveData()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-indigo-700 transition">Generate Premium Resume ➔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let base64Photo = "";

        document.getElementById('photo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = function() { base64Photo = reader.result; }
            if(file) { reader.readAsDataURL(file); }
        });

        window.onload = function() {
            if(localStorage.getItem('demoUpload') === 'true') {
                document.getElementById('name').value = "John Doe";
                document.getElementById('title').value = "Software Engineer";
                document.getElementById('phone').value = "+91 9876543210";
                document.getElementById('email').value = "john.doe@email.com";
                document.getElementById('address').value = "Mumbai, India";
                document.getElementById('skills').value = "HTML, CSS, JavaScript";
                document.getElementById('languages').value = "English, Hindi, Marathi";
                document.getElementById('hobbies').value = "Coding, Chess";
                document.getElementById('summary').value = "Highly motivated software engineer with experience in building web applications.";
                document.getElementById('experience').value = "Frontend Developer at Tech Corp (2024-Present)";
                document.getElementById('edu').value = "TY BSc IT, St. Andrew's College";
                
                localStorage.removeItem('demoUpload');
                alert("Form successfully auto-filled using Mock AI Parser!");
            }
        }

        function saveData() {
            const selectedTemplate = document.querySelector('input[name="template"]:checked').value;
            const resumeData = {
                template: selectedTemplate,
                name: document.getElementById('name').value || 'Shince Scaria',
                title: document.getElementById('title').value || 'Web Developer',
                phone: document.getElementById('phone').value || '+91 00000 00000',
                email: document.getElementById('email').value || 'shince@email.com',
                address: document.getElementById('address').value || 'Maharashtra, India',
                skills: document.getElementById('skills').value || 'HTML, Tailwind, JS',
                languages: document.getElementById('languages').value || 'English, Hindi',
                hobbies: document.getElementById('hobbies').value || 'Coding, Reading',
                summary: document.getElementById('summary').value || 'Passionate IT student building modern web applications.',
                experience: document.getElementById('experience').value || 'Fresher / College Projects',
                edu: document.getElementById('edu').value || 'TY BSc IT - St. Andrews College',
                photo: base64Photo 
            };
            localStorage.setItem('resumeData', JSON.stringify(resumeData));
            window.location.href = 'preview.html';
        }
    </script>
</body>
</html>
