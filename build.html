<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Build - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <a href="index.html" class="hover:text-indigo-600 transition">1. Intro</a>
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">2. Build</span>
        <span>3. Preview</span>
        <span>4. Download</span>
    </nav>

    <div class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="max-w-3xl w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            
            <h2 class="text-2xl font-bold text-slate-900 mb-4 border-b pb-2">1. Choose Template</h2>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <label class="border-2 border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-500 flex items-center gap-3">
                    <input type="radio" name="template" value="classic" checked class="w-5 h-5 text-indigo-600">
                    <span class="font-bold">Classic (Tabular)</span>
                </label>
                <label class="border-2 border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-500 flex items-center gap-3">
                    <input type="radio" name="template" value="modern" class="w-5 h-5 text-indigo-600">
                    <span class="font-bold">Modern (Sidebar)</span>
                </label>
            </div>

            <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-2">2. Enter Your Details</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Profile Photo</label>
                    <input type="file" id="photo" accept="image/*" class="w-full mt-1 p-2 bg-slate-50 border rounded-lg">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Full Name</label>
                        <input type="text" id="name" placeholder="Shince Shibu Scaria" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Job Title</label>
                        <input type="text" id="title" placeholder="TY BSc IT Student" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Phone</label>
                        <input type="text" id="phone" placeholder="+91 XXXXXXXXXX" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Email</label>
                        <input type="email" id="email" placeholder="shince@email.com" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Location</label>
                        <input type="text" id="address" placeholder="Nalasopara West" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Skills</label>
                        <input type="text" id="skills" placeholder="HTML, JavaScript, Git" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Languages</label>
                        <input type="text" id="languages" placeholder="English, Hindi, Marathi" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Hobbies</label>
                        <input type="text" id="hobbies" placeholder="Coding, Fitness" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700">Profile Summary</label>
                    <textarea id="summary" rows="3" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Work Experience</label>
                        <textarea id="experience" rows="3" placeholder="Fresher or Project Work..." class="w-full mt-1 p-3 bg-slate-50 border rounded-lg"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Education</label>
                        <textarea id="edu" rows="3" placeholder="TY BSc IT, St. Andrew's College" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg"></textarea>
                    </div>
                </div>

                <div class="mt-8 text-right">
                    <button onclick="saveData()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-indigo-700 transition">Generate Resume ➔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let base64Photo = "";

        document.getElementById('photo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 150;
                    canvas.height = 150;
                    ctx.drawImage(img, 0, 0, 150, 150);
                    base64Photo = canvas.toDataURL('image/jpeg', 0.7);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // POPULATE ALL EXTRACTED PDF TEXT INTO FORM
        window.onload = function() {
            const scannedData = JSON.parse(localStorage.getItem('extractedResume'));
            if (scannedData) {
                if (scannedData.name) document.getElementById('name').value = scannedData.name;
                if (scannedData.email) document.getElementById('email').value = scannedData.email;
                if (scannedData.phone) document.getElementById('phone').value = scannedData.phone;
                if (scannedData.summary) document.getElementById('summary').value = scannedData.summary;
                if (scannedData.experience) document.getElementById('experience').value = scannedData.experience;
                if (scannedData.edu) document.getElementById('edu').value = scannedData.edu;
                
                localStorage.removeItem('extractedResume');
            }
        }

        function saveData() {
            const selectedTemplate = document.querySelector('input[name="template"]:checked').value;
            const resumeData = {
                template: selectedTemplate,
                name: document.getElementById('name').value || 'Shince Shibu Scaria',
                title: document.getElementById('title').value || 'TY BSc IT Student',
                phone: document.getElementById('phone').value || '+91 00000 00000',
                email: document.getElementById('email').value || 'shince@email.com',
                address: document.getElementById('address').value || 'Nalasopara West, Mumbai',
                skills: document.getElementById('skills').value || 'HTML, Tailwind, JavaScript, Git',
                languages: document.getElementById('languages').value || 'English, Hindi, Marathi',
                hobbies: document.getElementById('hobbies').value || 'Coding, Reading',
                summary: document.getElementById('summary').value || 'Passionate IT student building modern web applications.',
                experience: document.getElementById('experience').value || 'Fresher / College Projects',
                edu: document.getElementById('edu').value || 'TY BSc IT - St. Andrew\'s College',
                photo: base64Photo 
            };
            
            localStorage.removeItem('resumeData');
            localStorage.setItem('resumeData', JSON.stringify(resumeData));
            window.location.href = 'preview.html';
        }
    </script>
</body>
</html>
