<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Build - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <a href="index.html" class="hover:text-indigo-600 transition">1. Intro</a>
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">2. Build</span>
        <span>3. Preview</span>
        <span>4. Download</span>
    </nav>

    <div class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="max-w-3xl w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            
            <h2 class="text-2xl font-bold text-slate-900 mb-4 border-b pb-2">1. Choose Template</h2>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <label class="border-2 border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-500 flex items-center gap-3">
                    <input type="radio" name="template" value="classic" checked class="w-5 h-5 text-indigo-600">
                    <span class="font-bold">Classic (Tabular)</span>
                </label>
                <label class="border-2 border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-500 flex items-center gap-3">
                    <input type="radio" name="template" value="modern" class="w-5 h-5 text-indigo-600">
                    <span class="font-bold">Modern (Sidebar)</span>
                </label>
            </div>

            <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-2">2. Personal & Academic Details</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Full Name</label>
                        <input type="text" id="name" placeholder="Shince Shibu Scaria" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Phone</label>
                        <input type="text" id="phone" placeholder="+91 XXXXXXXXXX" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Full Address</label>
                    <input type="text" id="address" placeholder="Nalasopara West, Maharashtra" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Date of Birth</label>
                        <input type="date" id="dob" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Languages Known</label>
                        <input type="text" id="languages" placeholder="English, Hindi, Marathi" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700">Highest Qualification (Degree/HSC)</label>
                    <input type="text" id="edu" placeholder="TY BSc IT, St. Andrew's College" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700">Career Objective / Profile</label>
                    <textarea id="summary" rows="3" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700">Work Experience</label>
                    <input type="text" id="experience" placeholder="Fresher or 6 months experience..." class="w-full mt-1 p-3 bg-slate-50 border rounded-lg outline-none">
                </div>

                <div class="mt-8 text-right">
                    <button onclick="saveData()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-indigo-700 transition">Save & See Preview ➔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function saveData() {
            const selectedTemplate = document.querySelector('input[name="template"]:checked').value;
            const resumeData = {
                template: selectedTemplate,
                name: document.getElementById('name').value || 'Shince Shibu Scaria',
                phone: document.getElementById('phone').value || '+91 0000000000',
                address: document.getElementById('address').value || 'Nalasopara West, Maharashtra',
                dob: document.getElementById('dob').value || '2005-01-01',
                languages: document.getElementById('languages').value || 'English, Hindi, Marathi',
                edu: document.getElementById('edu').value || 'TY BSc IT, St. Andrew\'s College',
                summary: document.getElementById('summary').value || 'To contribute to the organization with the best of my ability and develop new skills.',
                experience: document.getElementById('experience').value || 'Fresher'
            };
            localStorage.setItem('resumeData', JSON.stringify(resumeData));
            window.location.href = 'preview.html';
        }
    </script>
</body>
</html>
