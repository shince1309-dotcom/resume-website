<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Build - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <a href="index.html" class="hover:text-indigo-600 transition">1. Intro</a>
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">2. Build</span>
        <span>3. Preview</span>
        <span>4. Download</span>
    </nav>

    <div class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="max-w-2xl w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-2">Enter Your Details</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Full Name</label>
                    <input type="text" id="name" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Email</label>
                        <input type="email" id="email" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700">Phone</label>
                        <input type="text" id="phone" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Education</label>
                    <input type="text" id="edu" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Skills (Comma separated)</label>
                    <input type="text" id="skills" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Summary</label>
                    <textarea id="summary" rows="3" class="w-full mt-1 p-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                
                <div class="mt-6 text-right">
                    <button onclick="saveData()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow hover:bg-indigo-700 transition">Save & Next Step ➔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function saveData() {
            const resumeData = {
                name: document.getElementById('name').value || 'Shince Scaria',
                email: document.getElementById('email').value || 'student@domain.com',
                phone: document.getElementById('phone').value || '+91 00000 00000',
                edu: document.getElementById('edu').value || 'TY BSc IT, St. Andrew\'s College',
                skills: document.getElementById('skills').value || 'HTML, CSS, JavaScript, Git',
                summary: document.getElementById('summary').value || 'A dedicated IT student specializing in web development.'
            };
            // Save to browser memory
            localStorage.setItem('resumeData', JSON.stringify(resumeData));
            // Jump to page 3
            window.location.href = 'preview.html';
        }
    </script>
</body>
</html>
