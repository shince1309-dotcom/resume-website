<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3: Preview - Resume App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 sticky top-0 z-50 flex justify-center gap-8 text-sm font-semibold text-slate-400">
        <a href="index.html" class="hover:text-indigo-600 transition">1. Intro</a>
        <a href="build.html" class="hover:text-indigo-600 transition">2. Build</a>
        <span class="text-indigo-600 border-b-2 border-indigo-600 pb-1">3. Preview</span>
        <span>4. Download</span>
    </nav>

    <div class="flex-grow flex flex-col items-center justify-center px-4 py-10">
        
        <!-- The Generated Resume Format -->
        <div class="max-w-3xl w-full bg-white p-10 rounded-xl shadow-2xl border border-slate-200 min-h-[600px]">
            <div class="border-b-2 border-slate-100 pb-6 mb-6">
                <h1 id="outName" class="text-4xl font-extrabold text-slate-900 tracking-tight">Name</h1>
                <p class="text-slate-500 mt-2 font-medium">
                    <span id="outEmail">Email</span> • <span id="outPhone">Phone</span>
                </p>
            </div>
            <div class="mb-6">
                <h3 class="text-sm font-bold uppercase tracking-widest text-indigo-600 mb-2">Education</h3>
                <p id="outEdu" class="text-slate-800 font-semibold text-lg">Education</p>
            </div>
            <div class="mb-6">
                <h3 class="text-sm font-bold uppercase tracking-widest text-indigo-600 mb-2">Skills</h3>
                <p id="outSkills" class="text-slate-700 font-medium">Skills</p>
            </div>
            <div>
                <h3 class="text-sm font-bold uppercase tracking-widest text-indigo-600 mb-2">Profile</h3>
                <p id="outSummary" class="text-slate-600 leading-relaxed">Summary</p>
            </div>
        </div>

        <div class="mt-8">
            <a href="download.html" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow hover:bg-emerald-700 transition">Looks Good! Proceed to Download ➔</a>
        </div>
    </div>

    <script>
        // Load data from memory when page opens
        window.onload = function() {
            const data = JSON.parse(localStorage.getItem('resumeData'));
            if(data) {
                document.getElementById('outName').innerText = data.name;
                document.getElementById('outEmail').innerText = data.email;
                document.getElementById('outPhone').innerText = data.phone;
                document.getElementById('outEdu').innerText = data.edu;
                document.getElementById('outSkills').innerText = data.skills;
                document.getElementById('outSummary').innerText = data.summary;
            }
        };
    </script>
</body>
</html>
